# -----------------------------------------------------------------------
# SAC Baseline — assembly-v3
# Hyperparameters match pick_place_baseline.yaml for cross-task comparability.
# -----------------------------------------------------------------------

env:
  task: assembly-v3
  max_episode_steps: 500

agent:
  hidden_dim: 256
  n_layers: 2
  lr: 3.0e-4
  gamma: 0.99
  tau: 0.005
  auto_alpha: true
  alpha: 1.0
  alpha_lr: 1.0e-4
  alpha_min: 0.05
  batch_size: 128

training:
  total_steps: 2_500_000
  warmup_steps: 5_000
  updates_per_step: 1
  buffer_capacity: 1_000_000
  eval_freq: 50_000
  seed: 42

logging:
  use_wandb: false
  project: latent-recovery-rl
  run_name: sac_assembly_baseline
  log_freq: 1_000
