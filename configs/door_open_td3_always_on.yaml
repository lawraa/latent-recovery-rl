# -----------------------------------------------------------------------
# TD3 + Always-On Latent Correction — door-open-v3
# Co-adaptation baseline (joint training, no gradient isolation).
#
# Correction applied at every rollout step and every training step.
# Bellman target uses corrected policy — Q calibrated to always-corrected data.
# -----------------------------------------------------------------------

env:
  task: door-open-v3
  max_episode_steps: 500

agent:
  hidden_dim: 256
  n_layers: 2
  lr: 3.0e-4
  gamma: 0.99
  tau: 0.005
  policy_noise: 0.2
  noise_clip: 0.5
  policy_delay: 2
  explore_noise: 0.1
  batch_size: 256

correction:
  hidden_dim: 128
  n_layers: 2
  lr: 3.0e-4
  reg_coeff: 1.0e-3
  output_scale: 0.1

training:
  total_steps: 1_500_000
  warmup_steps: 10_000
  updates_per_step: 1
  buffer_capacity: 1_000_000
  eval_freq: 50_000
  seed: 0

logging:
  use_wandb: false
  project: latent-recovery-rl
  run_name: td3_door_always_on
  log_freq: 1_000
