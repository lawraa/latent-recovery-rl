# -----------------------------------------------------------------------
# TD3 Baseline — door-open-v3
#
# Standard TD3, no correction module.
# Door-open does not require precision grasping, making TD3's explore_noise=0.1
# more viable than on pick-place-v3.
# 1.5M steps: more exploration budget than SAC (1M) due to deterministic policy.
# -----------------------------------------------------------------------

env:
  task: door-open-v3
  max_episode_steps: 500

agent:
  hidden_dim: 256
  n_layers: 2
  lr: 3.0e-4
  gamma: 0.99
  tau: 0.005
  policy_noise: 0.2
  noise_clip: 0.5
  policy_delay: 2
  explore_noise: 0.1
  batch_size: 256

training:
  total_steps: 1_500_000
  warmup_steps: 10_000
  updates_per_step: 1
  buffer_capacity: 1_000_000
  eval_freq: 50_000
  seed: 0

logging:
  use_wandb: false
  project: latent-recovery-rl
  run_name: td3_door_baseline
  log_freq: 1_000
