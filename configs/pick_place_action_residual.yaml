# -----------------------------------------------------------------------
# SAC + Decoupled Action-Space Residual Correction — pick-place-v3
#
# Ablation baseline for the paper: correction operates in action space
# (pre-tanh Δa) instead of latent space (Δz).  All other hyperparameters
# are identical to pick_place_decoupled.yaml to enable fair comparison.
# -----------------------------------------------------------------------

env:
  task: pick-place-v3
  max_episode_steps: 500

agent:
  hidden_dim: 256
  n_layers: 2
  lr: 3.0e-4
  gamma: 0.99
  tau: 0.005
  auto_alpha: true
  alpha: 1.0
  alpha_lr: 1.0e-4
  alpha_min: 0.05
  batch_size: 128

correction:
  hidden_dim: 128
  n_layers: 2
  lr: 3.0e-4
  reg_coeff: 5.0e-2
  output_scale: 0.1

trigger:
  type: pick_place
  window: 20
  min_progress: 0.01
  cooldown: 15
  success_threshold: 0.05
  pregrasp_close: 0.04

training:
  total_steps: 2_500_000
  warmup_steps: 5_000
  updates_per_step: 1
  buffer_capacity: 1_000_000
  eval_freq: 50_000
  seed: 42

logging:
  use_wandb: false
  project: latent-recovery-rl
  run_name: sac_pp_action_residual
  log_freq: 1_000
