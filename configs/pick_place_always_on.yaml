# -----------------------------------------------------------------------
# SAC + Always-On Latent Correction — pick-place-v3
# Co-adaptation baseline: correction applied every step, joint training,
# no gradient isolation.
#
# Hyperparameters identical to pick_place_decoupled.yaml (alpha_min=0.05,
# alpha_lr=1e-4, warmup_steps=5000) for a fair multi-seed comparison.
# Replaces the old pick_place_latent_always.yaml (seed 42 only, missing
# alpha_min/alpha_lr, warmup_steps=1000).
#
# Purpose: complete the co-adaptation 2x2 table for pick-place-v3 across
# 4 seeds. After training, run eval_base_only.py to measure:
#   - always-on WITH correction  → expected ~96% (policy relies on correction)
#   - always-on WITHOUT correction → expected ~36% (co-adaptation collapse)
# -----------------------------------------------------------------------

env:
  task: pick-place-v3
  max_episode_steps: 500

agent:
  hidden_dim: 256
  n_layers: 2
  lr: 3.0e-4
  gamma: 0.99
  tau: 0.005
  auto_alpha: true
  alpha: 1.0
  alpha_lr: 1.0e-4
  alpha_min: 0.05
  batch_size: 128

correction:
  hidden_dim: 128
  n_layers: 2
  lr: 3.0e-4
  reg_coeff: 1.0e-3
  output_scale: 0.1

training:
  total_steps: 2_500_000
  warmup_steps: 5_000
  updates_per_step: 1
  buffer_capacity: 1_000_000
  eval_freq: 50_000
  seed: 0

logging:
  use_wandb: false
  project: latent-recovery-rl
  run_name: sac_pp_always_on
  log_freq: 1_000
