# -----------------------------------------------------------------------
# SAC Baseline — pick-place-v3
# Hyperparameters aligned with Meta-World single-task SAC reference.
# -----------------------------------------------------------------------

env:
  task: pick-place-v3
  max_episode_steps: 500

agent:
  hidden_dim: 256
  n_layers: 2
  lr: 3.0e-4
  gamma: 0.99
  tau: 0.005
  auto_alpha: true
  alpha: 1.0        # initial alpha — matches effective default (log_alpha init at 0)
  alpha_lr: 1.0e-4  # slower than actor/critic lr to reduce early collapse
  alpha_min: 0.05   # floor to prevent exploration death on hard seeds
  batch_size: 128

training:
  total_steps: 2_500_000
  warmup_steps: 5_000
  updates_per_step: 1
  buffer_capacity: 1_000_000
  eval_freq: 50_000
  seed: 42

logging:
  use_wandb: false
  project: latent-recovery-rl
  run_name: sac_pp_baseline
  log_freq: 1_000
