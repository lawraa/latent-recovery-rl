# -----------------------------------------------------------------------
# SAC + HER — pick-place-v3
#
# Agent hyperparameters identical to pick_place_baseline.yaml for a
# fair comparison. HER adds goal relabeling on top of plain SAC with no
# other changes to the algorithm.
#
# her_ratio=0.8: 80% of transitions relabeled with a future achieved goal.
# success_threshold=0.05: matches MetaWorld _TARGET_RADIUS (verified from source).
#
# Observation layout (MetaWorld 39-dim, verified empirically):
#   obs[4:7]   = object xyz
#   obs[36:39] = goal xyz  (||obj - goal|| == info['obj_to_target'])
# -----------------------------------------------------------------------

env:
  task: pick-place-v3
  max_episode_steps: 500

agent:
  hidden_dim: 256
  n_layers: 2
  lr: 3.0e-4
  gamma: 0.99
  tau: 0.005
  auto_alpha: true
  alpha: 1.0
  alpha_lr: 1.0e-4
  alpha_min: 0.05
  batch_size: 128

training:
  total_steps: 2_500_000
  warmup_steps: 5_000
  updates_per_step: 1
  buffer_capacity: 1_000_000
  eval_freq: 50_000
  her_ratio: 0.8
  success_threshold: 0.05
  seed: 0

logging:
  use_wandb: false
  project: latent-recovery-rl
  run_name: sac_pp_her
  log_freq: 1_000
