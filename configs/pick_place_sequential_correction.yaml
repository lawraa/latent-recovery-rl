# -----------------------------------------------------------------------
# SAC Sequential Correction — pick-place-v3
#
# Phase 2 only: correction module trained on top of a frozen converged
# baseline.  The pretrained checkpoint is passed via --pretrained-checkpoint
# on the command line (not set here, since it differs per seed).
#
# Total steps: 1,500,000 — shorter than the 2.5M concurrent run because
# the base actor is already converged; only the correction module trains.
#
# All other hyperparameters match pick_place_decoupled.yaml for a fair
# architectural comparison.
# -----------------------------------------------------------------------

env:
  task: pick-place-v3
  max_episode_steps: 500

agent:
  hidden_dim: 256
  n_layers: 2
  lr: 3.0e-4
  gamma: 0.99
  tau: 0.005
  auto_alpha: true
  alpha: 1.0
  alpha_lr: 1.0e-4
  alpha_min: 0.05
  batch_size: 128

correction:
  hidden_dim: 128
  n_layers: 2
  lr: 3.0e-4
  reg_coeff: 1.0e-3
  output_scale: 0.1

trigger:
  type: pick_place
  window: 20
  min_progress: 0.01
  cooldown: 15
  success_threshold: 0.05
  pregrasp_close: 0.04

training:
  total_steps: 1_500_000
  warmup_steps: 5_000
  updates_per_step: 1
  buffer_capacity: 1_000_000
  eval_freq: 50_000
  seed: 42

logging:
  use_wandb: false
  project: latent-recovery-rl
  run_name: sac_pp_seq_correction
  log_freq: 1_000
