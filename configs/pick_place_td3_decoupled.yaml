# -----------------------------------------------------------------------
# TD3 + Decoupled Latent Correction — pick-place-v3
# Gradient isolation fix (expected: no co-adaptation).
#
# Critic Bellman target: uses actor_target (base, no correction) so Q
#   accurately estimates the base policy value.
# Actor update:  standard TD3, no correction in graph.
# Correction update: torch.no_grad() on actor encoder prevents any gradient
#   from correction loss reaching actor parameters.
#
# Trigger: PickPlaceTrigger (same heuristic as SAC decoupled).
# All correction and agent hyperparameters match pick_place_decoupled.yaml
# for cross-algorithm comparability.
# -----------------------------------------------------------------------

env:
  task: pick-place-v3
  max_episode_steps: 500

agent:
  hidden_dim: 256
  n_layers: 2
  lr: 3.0e-4
  gamma: 0.99
  tau: 0.005
  policy_noise: 0.2
  noise_clip: 0.5
  policy_delay: 2
  explore_noise: 0.1
  batch_size: 256

correction:
  hidden_dim: 128
  n_layers: 2
  lr: 3.0e-4
  reg_coeff: 1.0e-3
  output_scale: 0.1

trigger:
  type: pick_place
  window: 20
  min_progress: 0.01
  cooldown: 15
  success_threshold: 0.05
  pregrasp_close: 0.04

training:
  total_steps: 2_500_000
  warmup_steps: 10_000
  updates_per_step: 1
  buffer_capacity: 1_000_000
  eval_freq: 50_000
  seed: 0

logging:
  use_wandb: false
  project: latent-recovery-rl
  run_name: td3_pp_decoupled
  log_freq: 1_000
