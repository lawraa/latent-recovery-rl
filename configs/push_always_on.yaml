# -----------------------------------------------------------------------
# SAC + Always-On Latent Correction — push-v3
# Co-adaptation baseline: correction applied every step, joint training,
# no gradient isolation.
#
# Hyperparameters identical to push_baseline.yaml and push_decoupled.yaml
# for a fair comparison. alpha_min=0.05 matches the current stable config.
#
# Purpose: complete the co-adaptation 2x2 table for push-v3.
#   - eval WITH correction  (train_with_correction.py normal eval) → expected ~89%
#   - eval WITHOUT correction (eval_base_only.py, triggered=False)  → expected ~32%
# -----------------------------------------------------------------------

env:
  task: push-v3
  max_episode_steps: 500

agent:
  hidden_dim: 256
  n_layers: 2
  lr: 3.0e-4
  gamma: 0.99
  tau: 0.005
  auto_alpha: true
  alpha: 1.0
  alpha_lr: 1.0e-4
  alpha_min: 0.05
  batch_size: 128

correction:
  hidden_dim: 128
  n_layers: 2
  lr: 3.0e-4
  reg_coeff: 1.0e-3
  output_scale: 0.1

training:
  total_steps: 2_500_000
  warmup_steps: 5_000
  updates_per_step: 1
  buffer_capacity: 1_000_000
  eval_freq: 50_000
  seed: 0

logging:
  use_wandb: false
  project: latent-recovery-rl
  run_name: sac_push_always_on
  log_freq: 1_000
