# -----------------------------------------------------------------------
# SAC + Decoupled Latent Correction — push-wall-v3
# Hyperparameters match push_decoupled.yaml for cross-task comparability.
#
# Trigger: PushWallTrigger (identical logic to PushTrigger).
#   Phase A (approach): hand-to-object stall when hand_to_obj > pregrasp_close.
#   Phase B (transport): obj_to_target stall when hand_to_obj <= pregrasp_close.
#   info['obj_to_target'] is live Euclidean distance to goal (not hardcoded).
#   The wall detour's x-offset (~0.1 m max) is dominated by y-travel (~0.25 m),
#   so obj_to_target decreases monotonically through the detour — no special
#   midpoint tracking is needed.
#   pregrasp_close=0.06 matches push-v3.
# -----------------------------------------------------------------------

env:
  task: push-wall-v3
  max_episode_steps: 500

agent:
  hidden_dim: 256
  n_layers: 2
  lr: 3.0e-4
  gamma: 0.99
  tau: 0.005
  auto_alpha: true
  alpha: 1.0
  alpha_lr: 1.0e-4
  alpha_min: 0.05
  batch_size: 128

correction:
  hidden_dim: 128
  n_layers: 2
  lr: 3.0e-4
  reg_coeff: 1.0e-3
  output_scale: 0.1

trigger:
  type: push_wall
  window: 20
  min_progress: 0.01
  cooldown: 15
  success_threshold: 0.05
  pregrasp_close: 0.06

training:
  total_steps: 2_500_000
  warmup_steps: 5_000
  updates_per_step: 1
  buffer_capacity: 1_000_000
  eval_freq: 50_000
  seed: 42

logging:
  use_wandb: false
  project: latent-recovery-rl
  run_name: sac_push_wall_decoupled
  log_freq: 1_000
