# -----------------------------------------------------------------------
# SAC + Decoupled Latent Correction — sweep-into-v3
# Hyperparameters match push_decoupled.yaml for cross-task comparability.
#
# Trigger: SweepIntoTrigger (identical structure to PushTrigger).
#   Phase A (approach): hand-to-object stall when hand_to_obj > pregrasp_close.
#   Phase B (transport): obj_to_target stall when hand_to_obj <= pregrasp_close.
#   info['obj_to_target'] is live (not hardcoded) in sweep-into-v3.
#   pregrasp_close=0.06 matches push-v3 — generous contact zone for reliable
#   Phase B activation while the hand is sweeping the object.
# -----------------------------------------------------------------------

env:
  task: sweep-into-v3
  max_episode_steps: 500

agent:
  hidden_dim: 256
  n_layers: 2
  lr: 3.0e-4
  gamma: 0.99
  tau: 0.005
  auto_alpha: true
  alpha: 1.0
  alpha_lr: 1.0e-4
  alpha_min: 0.05
  batch_size: 128

correction:
  hidden_dim: 128
  n_layers: 2
  lr: 3.0e-4
  reg_coeff: 1.0e-3
  output_scale: 0.1

trigger:
  type: sweep_into
  window: 20
  min_progress: 0.01
  cooldown: 15
  success_threshold: 0.05
  pregrasp_close: 0.06

training:
  total_steps: 1_200_000
  warmup_steps: 5_000
  updates_per_step: 1
  buffer_capacity: 1_000_000
  eval_freq: 50_000
  seed: 42

logging:
  use_wandb: false
  project: latent-recovery-rl
  run_name: sac_sweep_into_decoupled
  log_freq: 1_000
